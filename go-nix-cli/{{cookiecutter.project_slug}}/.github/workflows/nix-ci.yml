name: Nix CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  nix-check:
    name: Nix Check ({% raw %}${{ matrix.os }}{% endraw %})
    runs-on: {% raw %}${{ matrix.os }}{% endraw %}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: {% raw %}${{ github.head_ref || github.ref }}{% endraw %}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Configure Cachix
        uses: cachix/cachix-action@v16
        with:
          name: {% raw %}${{ github.repository_owner }}{% endraw %}
          authToken: {% raw %}${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}{% endraw %}

      - name: Verify and fix gomod2nix.toml
        if: matrix.os == 'ubuntu-latest'
        run: |
          nix develop -c just gomod2nix
          if ! git diff --exit-code -- gomod2nix.toml; then
            echo "gomod2nix.toml was out of date and has been regenerated"
            if [ "{% raw %}${{ github.event_name }}{% endraw %}" = "pull_request" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add gomod2nix.toml
              git commit -m "chore: update gomod2nix.toml"
              git push
              echo "Fixed and pushed gomod2nix.toml — CI will re-trigger the check"
            else
              echo "Push to main — failing the check instead of auto-fixing"
              exit 1
            fi
          fi

      - name: Nix flake check
        run: nix flake check
